name: "Pull orchestrator artifact (temp dir only)"
description: "Download one artifact into a temp dir under $RUNNER_TEMP and expose its absolute path"

inputs:
  token:
    description: "Token with actions:read on the SOURCE repo"
    required: true
  source_owner:
    required: true
  source_repo:
    required: true
  run_id:
    required: true
  artifact_name:
    description: "Artifact name to download"
    required: true
  subdir:
    description: "Subdirectory name under the temp root to extract into"
    default: "artifact"

outputs:
  temp_dir:
    description: "Absolute temp root used for download"
    value: ${{ steps.paths.outputs.temp_dir }}
  artifact_path:
    description: "Absolute path where the artifact was extracted"
    value: ${{ steps.paths.outputs.artifact_path }}

runs:
  using: "composite"
  steps:
    - name: Prepare temp dir
      id: paths
      shell: bash
      env:
        SUBDIR: ${{ inputs.subdir }}
      run: |
        set -euo pipefail
        temp_dir="$(mktemp -d "${RUNNER_TEMP}/orchestrator.XXXXXX")"
        artifact_path="${temp_dir}/${SUBDIR}"
        mkdir -p "$artifact_path"
        echo "temp_dir=$temp_dir"       >> "$GITHUB_OUTPUT"
        echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"

    - name: Download artifact
      uses: actions/download-artifact@v5
      with:
        name:         ${{ inputs.artifact_name }}
        repository:   ${{ inputs.source_owner }}/${{ inputs.source_repo }}
        run-id:       ${{ inputs.run_id }}
        github-token: ${{ inputs.token }}
        path:         ${{ steps.paths.outputs.artifact_path }}
        if-no-files-found: error
