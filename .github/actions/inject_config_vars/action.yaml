name: "Inject vars"
description: "Inject vars"

runs:
  using: "composite"
  steps:
    - name: Сheckout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with: { python-version: "3.x" }

    - name: Install injector deps
      shell: bash
      run: python -m pip install -r ${{ github.action_path }}/requirements.txt

    - name: Get pushed variables
      shell: bash
      run: |
        RESP=$(curl -sS -w "\n%{http_code}" \
          -H "Authorization: Bearer ${{ secrets.VARS_LIST_TOKEN }}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/actions/variables?per_page=100")
    
        CODE=$(echo "$RESP" | tail -n1)
        BODY=$(echo "$RESP" | sed '$d')
    
        echo "HTTP $CODE"
        if [ "$CODE" != "200" ]; then
          echo "Response body:"
          echo "$BODY" | jq . || echo "$BODY"
          exit 1
        fi
    
        # Convert to {name: value} map
        VARS_JSON=$(echo "$BODY" | jq -c '.variables // [] | map({(.name): .value}) | add // {}')
    
        echo "VARS_JSON=$VARS_JSON" >> "$GITHUB_ENV"

    - name: Inject pushed variables
      shell: bash
      run: python ${{ github.action_path }}/scripts/inject_vars.py --vars-json '${{ env.VARS_JSON }}'

    - name: Commit incorporated changes
      shell: bash
      run: |
        git config user.name "Config Injector"
        git config user.email "config-injector@example.com"
        git add -A
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "chore(config): inject config vars"
          git push origin HEAD:main
        fi
