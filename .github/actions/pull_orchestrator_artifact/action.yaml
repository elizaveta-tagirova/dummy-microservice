name: "Pull orchestrator artifact"
description: "Pull orchestrator artifact"

inputs:
  token:
    description: "Token with read access to the source repo"
    required: true
  source_owner:
    description: "Owner of the source repo"
    required: true
  source_repo:
    description: "Name of the source repo"
    required: true
  run_id:
    description: "Workflow run ID to download from"
    required: true
  artifact_name_files:
    description: "Artifact name to download"
    required: true
  artifact_name_vars:
    description: "Artifact name to download"
    required: true
  path:
    description: "Destination directory"
    default: ".orchestrator-artifacts"
    required: false

outputs:
  download_path:
    description: "Absolute path where the artifact was downloaded"
    value: ${{ steps.download_artifact.outputs['download-path'] }}

runs:
  using: "composite"
  steps:
    - name: Сheckout
      uses: actions/checkout@v4

    - name: Check directory exists
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${{ inputs.path }}"

    - name: Download artifact from orchestrator
      id: download_artifact
      uses: actions/download-artifact@v5
      with:
        name: |
          ${{ inputs.artifact_name_files }}
          ${{ inputs.artifact_name_vars }}
        repository: ${{ inputs.source_owner }}/${{ inputs.source_repo }}
        run-id: ${{ inputs.run_id }}
        github-token: ${{ inputs.token }}
        path: ${{ inputs.path }}
        if-no-files-found: error

    - name: Commit changes
      shell: bash
      run: |
        git config user.name "Config Injector"
        git config user.email "config-injector@example.com"
        git add -A
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "chore(config): save artifacts"
          git push origin HEAD:main
        fi
