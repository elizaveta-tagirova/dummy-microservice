name: "Inject vars"
description: "Read a YAML vars file and apply variables; commit if changed"

inputs:
  filepath:
    description: "Path to the YAML file"
    required: true

runs:
  using: "composite"
  env:
    VARS_FILE: ${{ inputs.filepath }}
  steps:
    - name: Check VARS_FILE
      shell: bash
      run: test -f "$VARS_FILE"

    - name: Install yq
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v yq >/dev/null 2>&1; then
          ver="v4.44.3"
          curl -sSL -o "$RUNNER_TEMP/yq" "https://github.com/mikefarah/yq/releases/download/${ver}/yq_linux_amd64"
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
        fi
        yq --version

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.x"

    - name: Install injector deps
      shell: bash
      run: python -m pip install -r "${{ github.action_path }}/requirements.txt"

    - name: Read vars file → VARS_JSON
      shell: bash
      run: |
        set -euo pipefail
        json="$(yq -o=json '.' "$VARS_FILE")"
        printf 'VARS_JSON=%s\n' "$(echo "$json" | jq -c '.')" >> "$GITHUB_ENV"

    - name: Inject variables
      shell: bash
      run: python "${{ github.action_path }}/scripts/inject_vars.py" --vars-json "$VARS_JSON"

    - name: Commit incorporated changes
      shell: bash
      run: |
        set -euo pipefail
        git config user.name  "Config Injector"
        git config user.email "config-injector@example.com"
        git add -A
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "chore(config): inject config vars"
          git push origin "HEAD:${GITHUB_REF_NAME}"
        fi
