name: Test Workflow

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-workflow, import-from-orchestrator]

permissions:
  contents: write
  actions: read

jobs:
  pull-config-artifact:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Check if to pull artifact
        id: condition
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" && "${{ github.event.action }}" == "import-from-orchestrator" ]]; then
            echo "run=true"
            echo "run=true"  >> "$GITHUB_OUTPUT"
          else
            echo "run=false"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull artifact from orchestrator
        id: pull_artifact
        if: steps.condition.outputs.run == 'true'
        uses: ./.github/actions/pull_orchestrator_artifact
        with:
          token: ${{ secrets.VARS_LIST_TOKEN }}
          source_owner: ${{ github.event.client_payload.source_owner }}
          source_repo: ${{ github.event.client_payload.source_repo }}
          run_id: ${{ github.event.client_payload.run_id }}
          artifact_name_files: ${{ github.event.client_payload.artifact_name_files }}
          artifact_name_vars: ${{ github.event.client_payload.artifact_name_vars }}
          path: ${{ github.event.client_payload.save_path }}

      - name: List downloaded
        if: steps.condition.outputs.run == 'true'
        run: |
          echo "Downloaded to: ${{ steps.pull_artifact.outputs.download_path }}"
          find "${{ steps.pull_artifact.outputs.download_path }}" -type f -print

  inject-config-files:
    runs-on: ubuntu-latest
    needs: [pull-config-artifact]
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Inject files
        id: inject_config_files
        uses: ./.github/actions/inject_config_files

  inject-config-vars:
    runs-on: ubuntu-latest
    needs: [pull-config-artifact]
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Inject vars
        id: inject_config_vars
        uses: ./.github/actions/inject_config_vars
        with:
          token: ${{ secrets.VARS_LIST_TOKEN }}
