name: Test Workflow

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-workflow]

permissions:
  contents: write

jobs:
  inject-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Сheckout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: main

      - name: Check generated configs pushed
        run: test -d .config/generated

      - name: Setup Python
        uses: actions/setup-python@v4
        with: { python-version: "3.x" }

      - name: Install injector deps
        run: python -m pip install -r tools/requirements.txt

      - name: Inject generated configs
        run: python tools/inject_configs.py --env prod

      - name: Get pushed variables
        run: |
          RESP=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: token ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/variables?per_page=100")
      
          CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')
      
          echo "HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "Response body:"
            echo "$BODY" | jq . || echo "$BODY"
            exit 1
          fi
      
          # Convert to {name: value} map
          VARS_JSON=$(echo "$BODY" | jq -c '.variables // [] | map({(.name): .value}) | add // {}')
      
          echo "VARS_JSON=$VARS_JSON" >> "$GITHUB_ENV"

      - name: Inject pushed variables
        run: python tools/inject_vars.py --vars-json '${{ env.VARS_JSON }}'

      - name: Commit incorporated changes
        run: |
          git config user.name "Config Injector"
          git config user.email "config-injector@example.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(config): inject .config/generated"
            git push origin HEAD:main
          fi

  test:
    needs: [inject-configs]
    runs-on: ubuntu-latest
    steps:
      - name: Echo message
        run: echo "Received dispatch trigger-workflow"
