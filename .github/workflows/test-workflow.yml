name: Test Workflow

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-workflow, import-from-orchestrator]

env:
  CONFIGS_SAVE_PATH: .orchestrator-configs
  VARS_FILE_NAME: app-vars-set-1.yaml

permissions:
  contents: write
  actions: read

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      should_pull: ${{ steps.flag.outputs.should_pull }}
    steps:
      - id: flag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" && "${{ github.event.action }}" == "import-from-orchestrator" ]]; then
            echo "should_pull=true"  >> "$GITHUB_OUTPUT"
          else
            echo "should_pull=false" >> "$GITHUB_OUTPUT"
          fi

  inject-config-files:
    needs: [decide]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Pull artifacts (files) into $RUNNER_TEMP (optional)
        id: pull
        if: needs.decide.outputs.should_pull == 'true'
        uses: ./.github/actions/pull_orchestrator_artifact_2
        with:
          token:         ${{ secrets.VARS_LIST_TOKEN }}
          source_owner:  ${{ github.event.client_payload.source_owner }}
          source_repo:   ${{ github.event.client_payload.source_repo }}
          run_id:        ${{ github.event.client_payload.run_id }}
          artifact_name: ${{ github.event.client_payload.artifact_name_files }}

      - name: Resolve source path for FILES
        id: resolve_files
        shell: bash
        env:
          FALLBACK_FILES_DIR: ${{ env.CONFIGS_SAVE_PATH }}/files
        run: |
          set -euo pipefail
          if [[ "${{ needs.decide.outputs.should_pull }}" == "true" ]]; then
            use_path="${{ steps.pull.outputs.artifact_path }}"
          else
            use_path="${GITHUB_WORKSPACE}/${FALLBACK_FILES_DIR}"
          fi
          echo "source_path=${use_path}" >> "$GITHUB_OUTPUT"

      - name: Inject files
        uses: ./.github/actions/inject_config_files_2
        with:
          source_path: ${{ steps.resolve_files.outputs.source_path }}

  inject-config-vars:
    needs: [decide]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Pull artifacts (vars) into $RUNNER_TEMP (optional)
        id: pull
        if: needs.decide.outputs.should_pull == 'true'
        uses: ./.github/actions/pull_orchestrator_artifact_2
        with:
          token:         ${{ secrets.VARS_LIST_TOKEN }}
          source_owner:  ${{ github.event.client_payload.source_owner }}
          source_repo:   ${{ github.event.client_payload.source_repo }}
          run_id:        ${{ github.event.client_payload.run_id }}
          artifact_name: ${{ github.event.client_payload.artifact_name_vars }}  # <-- fixed

      - name: Resolve filepath for VARS
        id: resolve_vars
        shell: bash
        env:
          FALLBACK_VARS_DIR: ${{ env.CONFIGS_SAVE_PATH }}/vars
          VARS_FILE_NAME:    ${{ env.VARS_FILE_NAME }}
        run: |
          set -euo pipefail
          if [[ "${{ needs.decide.outputs.should_pull }}" == "true" ]]; then
            vars_file="${{ steps.pull.outputs.artifact_path }}/${VARS_FILE_NAME}"
          else
            vars_file="${GITHUB_WORKSPACE}/${FALLBACK_VARS_DIR}/${VARS_FILE_NAME}"
          fi
          echo "vars_file=${vars_file}" >> "$GITHUB_OUTPUT"

      - name: Inject vars
        uses: ./.github/actions/inject_config_vars_2
        with:
          filepath: ${{ steps.resolve_vars.outputs.vars_file }}
